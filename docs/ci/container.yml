name: Container

# A Dockerfile that CI never builds rots exactly like a release workflow that
# no longer runs. This builds the image on every change to it, and publishes to
# GHCR on a release tag so that `-profile docker` has something to pull.

on:
  push:
    branches: [master]
    paths:
      - 'containers/**'
      - 'CMakeLists.txt'
      - 'CommonCMake.txt'
      - 'src/**'
      - '.gitmodules'
      - '.github/workflows/container.yml'
    tags:
      - 'rel-*'
  pull_request:
    paths:
      - 'containers/**'
      - 'src/**'
  workflow_dispatch:
  # ProteoWizard is fetched from a floating ".lastSuccessful" URL, so this image
  # can break without a single commit to this repository. Build it weekly so we
  # find out from CI rather than from a user.
  schedule:
    - cron: '0 4 * * 1'

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/quandenser
          tags: |
            type=ref,event=branch
            type=match,pattern=rel-(.*),group=1
            type=sha

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/quandenser/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_JOBS=4
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the built image
        if: github.event_name == 'pull_request'
        run: |
          docker build -t quandenser:ci -f containers/quandenser/Dockerfile .
          docker run --rm quandenser:ci quandenser --help
