name: Pipeline CI

on:
  push:
    paths:
      - 'main.nf'
      - 'nextflow.config'
      - 'modules/**'
      - 'workflows/**'
      - 'conf/**'
      - 'assets/**'
      - '.github/workflows/pipeline_ci.yml'
  pull_request:
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  lint:
    name: Lint the pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: nf-core/setup-nextflow@v2

      - name: nextflow lint
        run: nextflow lint main.nf workflows/ modules/ conf/ nextflow.config

  stub:
    name: Stub run
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: nf-core/setup-nextflow@v2

      # Exercises the channel topology without needing the container image or
      # any real data, so it stays fast enough to run on every push.
      - name: Core workflow
        run: nextflow run . -profile test -stub-run --outdir results

      - name: Including identification and Triqler
        run: |
          printf '>sp|TEST|TEST_PROT\nMKWVTFISLLLLFSSAYSR\n' > test.fasta
          cat > params.json <<'EOF'
          { "run_identification": true, "skip_triqler": false, "fasta": "test.fasta" }
          EOF
          nextflow run . -profile test -stub-run -params-file params.json --outdir results_full
